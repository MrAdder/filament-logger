# SonarQube Cloud project configuration.
#
# Read by the scan step in .github/workflows/run-tests.yml. Values confirmed
# against the project's own API rather than assumed.
sonar.projectKey=MrAdder_filament-logger
sonar.organization=mradder

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Automatic Analysis cannot import coverage, which is why the project currently
# reports a quality gate but no coverage figure. These two reports are produced
# by the coverage job and are the reason for running the scanner in CI instead.
sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.php.tests.reportPath=build/report.junit.xml

sonar.exclusions=vendor/**,docs/**,build/**,art/**,database/migrations/**
sonar.coverage.exclusions=tests/**,config/**,resources/**,database/**
