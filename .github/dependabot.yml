# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"

  # laravel/pint is pinned to an exact version in composer.json so that CI and
  # local runs always apply the same formatting rules. Dependabot is what turns
  # a Pint release into a deliberate PR (where any reformatting is reviewed)
  # rather than a surprise failure on an unrelated pull request.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    allow:
      - dependency-name: "laravel/pint"
    # Pint 1.30.5 and later require PHP 8.3, but the package still supports
    # PHP 8.2 and every dev dependency must install there. Drop this ignore
    # when PHP 8.2 support is dropped.
    ignore:
      - dependency-name: "laravel/pint"
        versions: [">=1.30.5"]
