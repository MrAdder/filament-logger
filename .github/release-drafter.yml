name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'
change-template: '- $TITLE by @$AUTHOR in #$NUMBER'
change-title-escapes: '\<*_&`'
no-changes-template: '- No user-facing changes in this release.'
template: |
  ## Summary

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

# Categories use the unified model from release-drafter 7.10
# (release-drafter/release-drafter#1558): changelog sections, the
# skip-changelog exclusion and version resolution are all categories.
categories:
  - type: pre-exclude
    when:
      label: skip-changelog

  - title: Features
    when:
      labels:
        - feature
        - enhancement
  - title: Fixes
    when:
      labels:
        - fix
        - bug
        - bugfix
  - title: Security
    when:
      label: security
  - title: Documentation
    when:
      labels:
        - documentation
        - docs
  - title: Testing and CI
    when:
      labels:
        - tests
        - ci
  - title: Maintenance
    when:
      labels:
        - chore
        - dependencies
        - refactor

  # Version resolution. The highest matching increment wins; the last entry,
  # with no `when`, is the patch fallback for unlabelled pull requests.
  - type: version-resolver
    semver-increment: major
    when:
      label: major
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        - minor
        - feature
        - enhancement
  - type: version-resolver
    semver-increment: patch
    when:
      labels:
        - patch
        - fix
        - bug
        - bugfix
        - security
        - documentation
        - docs
        - tests
        - ci
        - chore
        - dependencies
        - refactor
  - type: version-resolver
    semver-increment: patch
