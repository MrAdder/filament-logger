name: Run Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE*'
      - 'art/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE*'
      - 'art/**'
      - 'docs/**'

concurrency:
  group: run-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }} / ${{ matrix.stability }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            filament: '3.*'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            filament: '^4.3.1'
            stability: prefer-lowest
          - os: ubuntu-latest
            php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            filament: '^4.3.1'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            filament: '5.*'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            filament: '^4.3.1'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            filament: '^4.3.1'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            filament: '5.*'
            stability: prefer-lowest
          - os: ubuntu-latest
            php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            filament: '5.*'
            stability: prefer-lowest
          - os: ubuntu-latest
            php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            filament: '5.*'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            filament: '5.*'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.5'
            laravel: '12.*'
            testbench: '10.*'
            filament: '5.*'
            stability: prefer-stable
          - os: windows-latest
            php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            filament: '5.*'
            stability: prefer-stable
          - os: windows-latest
            php: '8.5'
            laravel: '13.*'
            testbench: '11.*'
            filament: '5.*'
            stability: prefer-stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6
        with:
          php-version: ${{ matrix.php }}
          extensions: none, curl, dom, fileinfo, intl, mbstring, openssl, pdo_sqlite, simplexml, sqlite, tokenizer, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-testbench-${{ matrix.testbench }}-filament-${{ matrix.filament }}-${{ matrix.stability }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-testbench-${{ matrix.testbench }}-filament-${{ matrix.filament }}-${{ matrix.stability }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-filament-${{ matrix.filament }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
            ${{ runner.os }}-composer-

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-update
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --${{ matrix.stability }} --prefer-dist --with-all-dependencies --no-progress

      - name: Execute tests
        run: vendor/bin/pest --no-coverage

  laravel13-filament5-required:
    name: Laravel 13 / Filament 5 Required Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6
        with:
          php-version: '8.3'
          extensions: none, curl, dom, fileinfo, intl, mbstring, openssl, pdo_sqlite, simplexml, sqlite, tokenizer, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.3-laravel-13-testbench-11-filament-5-required-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-laravel-13-testbench-11-filament-5-required-composer-
            ${{ runner.os }}-php-8.3-composer-
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Laravel 13 + Filament 5 dependencies
        run: |
          composer require "filament/filament:5.*" --no-update
          composer require --dev "laravel/framework:13.*" "orchestra/testbench:11.*" --no-update
          composer update --prefer-stable --prefer-dist --with-all-dependencies --no-progress

      - name: Execute tests
        run: vendor/bin/pest --no-coverage
