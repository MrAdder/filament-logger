name: Run Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE*'
      - 'art/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE*'
      - 'art/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: run-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
            stability: prefer-lowest
          - os: ubuntu-latest
            php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-lowest
          - os: ubuntu-latest
            php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.5'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-stable
          - os: windows-latest
            php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6
        with:
          php-version: ${{ matrix.php }}
          extensions: none, curl, dom, mbstring, sqlite, pdo_sqlite, tokenizer
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --${{ matrix.stability }} --prefer-dist --with-all-dependencies --no-progress

      - name: Execute tests
        run: vendor/bin/pest --no-coverage
