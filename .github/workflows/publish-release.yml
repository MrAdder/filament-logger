name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish, for example v0.9.1'
        required: true
        type: string
      target:
        description: 'Branch to release from'
        required: true
        default: main
        type: string
      prerelease:
        description: 'Publish this as a prerelease'
        required: true
        default: false
        type: boolean
      latest:
        description: 'Mark the published release as latest'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
          - legacy

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6
        with:
          php-version: '8.4'
          extensions: none, curl, dom, fileinfo, intl, mbstring, openssl, pdo_sqlite, simplexml, sqlite, tokenizer, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-
            ${{ runner.os }}-composer-

      - name: Validate release inputs
        id: release_meta
        shell: bash
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

          echo "version_number=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$INPUT_VERSION" >/dev/null 2>&1; then
            echo "Tag $INPUT_VERSION already exists on origin."
            exit 1
          fi
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda

      - name: Run test suite
        run: vendor/bin/pest --no-coverage

      - name: Run static analysis
        run: php -d memory_limit=512M vendor/bin/phpstan analyse

      - name: Publish GitHub release
        id: release
        uses: release-drafter/release-drafter@4d75298e00d9e34c483e5ff8c68d0ea1c1940c1e
        with:
          publish: true
          name: ${{ inputs.version }}
          tag: ${{ inputs.version }}
          version: ${{ steps.release_meta.outputs.version_number }}
          prerelease: ${{ inputs.prerelease }}
          latest: ${{ inputs.latest }}
          commitish: ${{ inputs.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release date
        id: release_date
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Update changelog
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ steps.release_date.outputs.value }}
          RELEASE_NOTES: ${{ steps.release.outputs.body }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("CHANGELOG.md")
          version = os.environ["INPUT_VERSION"]
          release_date = os.environ["RELEASE_DATE"]
          release_notes = os.environ["RELEASE_NOTES"].strip()
          content = path.read_text(encoding="utf-8")

          unreleased_heading = f"## {version} - Unreleased"
          released_heading = f"## {version} - {release_date}"

          if unreleased_heading in content:
              content = content.replace(unreleased_heading, released_heading, 1)
          elif re.search(rf"^## {re.escape(version)} - ", content, flags=re.MULTILINE):
              pass
          else:
              marker = "All notable changes to `filament-logger` will be documented in this file.\n"

              if marker not in content:
                  raise SystemExit("Unable to locate changelog introduction marker.")

              insertion = f"\n## {version} - {release_date}\n\n{release_notes}\n"
              marker_index = content.index(marker) + len(marker)
              content = content[:marker_index] + insertion + content[marker_index:]

          path.write_text(content, encoding="utf-8")
          PY

      - name: Commit updated changelog
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          branch: ${{ inputs.target }}
          commit_message: "docs: update changelog for ${{ inputs.version }}"
          file_pattern: CHANGELOG.md
