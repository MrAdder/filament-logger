name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'pint.json'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'pint.json'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  pint:
    name: pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6
        with:
          php-version: '8.2'
          extensions: none, curl, dom, fileinfo, intl, mbstring, openssl, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.2-lint-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-lint-composer-
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer update --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
