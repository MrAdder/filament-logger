name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Update release draft
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
