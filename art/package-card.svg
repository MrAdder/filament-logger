<svg xmlns="http://www.w3.org/2000/svg" width="1261" height="720" viewBox="0 0 1261 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Filament Logger package card</title>
  <desc id="desc">Promotional card for Filament Logger with the composer require command.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1261" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#faf8f4" />
      <stop offset="1" stop-color="#f4f1eb" />
    </linearGradient>

    <pattern id="pinstripes" width="58" height="720" patternUnits="userSpaceOnUse">
      <path d="M29 0V720" stroke="#EDE7DF" stroke-width="1" />
      <path d="M0 0L34 720" stroke="#F1ECE5" stroke-width="1" />
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#251814" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1261" height="720" fill="url(#bg)" />
  <rect width="1261" height="720" fill="url(#pinstripes)" opacity="0.9" />

  <g opacity="0.58" transform="translate(1140 0)">
    <path d="M0 0L36 14L40 56L8 44L0 0Z" stroke="#F05252" stroke-width="4" stroke-linejoin="round" />
    <path d="M36 14L72 0L112 10L76 24L36 14Z" stroke="#F05252" stroke-width="4" stroke-linejoin="round" />
    <path d="M76 24L72 0L104 14L108 56L76 24Z" stroke="#F05252" stroke-width="4" stroke-linejoin="round" />
    <path d="M8 44L40 56L72 98L36 86L8 44Z" stroke="#F05252" stroke-width="4" stroke-linejoin="round" />
    <path d="M40 56L76 24L108 56L72 98L40 56Z" stroke="#F05252" stroke-width="4" stroke-linejoin="round" />
    <path d="M108 56L140 42L144 84L112 98L108 56Z" stroke="#F05252" stroke-width="4" stroke-linejoin="round" />
    <path d="M76 24L112 10L140 42L108 56L76 24Z" stroke="#F05252" stroke-width="4" stroke-linejoin="round" />
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="252" y="183" width="757" height="344" rx="28" fill="#FCFBF8" fill-opacity="0.74" />
  </g>

  <g text-anchor="middle">
    <text
      x="630.5"
      y="293"
      fill="#0F172A"
      font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="62"
      font-weight="700"
      letter-spacing="-0.04em"
    >
      Filament Logger
    </text>

    <text
      x="630.5"
      y="362"
      fill="#1F2937"
      font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="34"
      font-weight="400"
    >
      <tspan x="630.5" dy="0">Audit logging for Filament admin panels</tspan>
      <tspan x="630.5" dy="48">with exports, alerts, and dashboards.</tspan>
    </text>

    <text
      x="630.5"
      y="476"
      fill="#EF4444"
      font-family="'Cascadia Mono', 'Courier New', monospace"
      font-size="33"
      font-weight="700"
    >
      `composer require mradder/filament-logger`
    </text>
  </g>
</svg>
