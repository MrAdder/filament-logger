<svg xmlns="http://www.w3.org/2000/svg" width="1261" height="720" viewBox="0 0 1261 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Filament Logger package card</title>
  <desc id="desc">Promotional card for Filament Logger showing the high-risk activity review screen with a short product tagline.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBF8F3" />
      <stop offset="1" stop-color="#F4EFE7" />
    </linearGradient>

    <pattern id="pinstripes" width="52" height="720" patternUnits="userSpaceOnUse">
      <path d="M0 0L34 720" stroke="#EDE6DC" stroke-width="1" stroke-opacity="0.55" />
      <path d="M26 0V720" stroke="#E9E2D9" stroke-width="1" stroke-opacity="0.5" />
    </pattern>

    <radialGradient id="glow-main" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(982 356) rotate(90) scale(244 244)">
      <stop offset="0" stop-color="#F67058" stop-opacity="0.24" />
      <stop offset="1" stop-color="#F67058" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-soft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(783 240) rotate(90) scale(184 184)">
      <stop offset="0" stop-color="#FED4AA" stop-opacity="0.24" />
      <stop offset="1" stop-color="#FED4AA" stop-opacity="0" />
    </radialGradient>

    <filter id="screenshot-shadow" x="505" y="56" width="780" height="560" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111827" flood-opacity="0.18" />
    </filter>

    <clipPath id="screen-clip">
      <rect x="565" y="116" width="650" height="429" rx="28" />
    </clipPath>
  </defs>

  <rect width="1261" height="720" fill="url(#bg)" />
  <rect width="1261" height="720" fill="url(#pinstripes)" />
  <circle cx="982" cy="356" r="244" fill="url(#glow-main)" />
  <circle cx="783" cy="240" r="184" fill="url(#glow-soft)" />

  <g opacity="0.72">
    <path d="M1142 28L1182 42" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1182 42L1220 28" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1220 28L1256 40" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1256 40L1260 88" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1260 88L1224 104" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1224 104L1186 88" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1186 88L1152 42" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1182 42L1186 88" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1220 28L1224 104" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1186 88L1224 104" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1224 104L1260 88" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1182 42L1224 56" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <path d="M1224 56L1256 40" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
  </g>

  <g filter="url(#screenshot-shadow)">
    <rect x="565" y="116" width="650" height="429" rx="28" fill="#0B0B0F" />
    <image
      href="activity-review-high-risk-tab.png"
      x="565"
      y="116"
      width="650"
      height="429"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#screen-clip)"
    />
    <rect x="566" y="117" width="648" height="427" rx="27" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" />
  </g>

  <g>
    <rect x="84" y="112" width="170" height="38" rx="19" fill="#FEEAE6" stroke="#FACCC4" />
    <text x="104" y="137" fill="#B91C1C" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600">
      Audit logging plugin
    </text>
  </g>

  <text
    x="84"
    y="259"
    fill="#0F172A"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="60"
    font-weight="700"
    letter-spacing="-0.04em"
  >
    Filament Logger
  </text>

  <text
    x="84"
    y="328"
    fill="#1F2937"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="600"
  >
    <tspan x="84" dy="0">Audit visibility for Filament</tspan>
    <tspan x="84" dy="38">admin panels</tspan>
  </text>

  <text
    x="84"
    y="420"
    fill="#475569"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="400"
  >
    <tspan x="84" dy="0">Review resource changes, auth issues,</tspan>
    <tspan x="84" dy="34">exports, alerts, and dashboard trends</tspan>
    <tspan x="84" dy="34">from one searchable interface.</tspan>
  </text>

  <g>
    <rect x="84" y="552" width="142" height="42" rx="21" fill="#FFFCF8" stroke="#E3DACF" />
    <text x="101" y="579" fill="#1E293B" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600">
      Review tabs
    </text>
    <rect x="234" y="552" width="102" height="42" rx="21" fill="#FFFCF8" stroke="#E3DACF" />
    <text x="251" y="579" fill="#1E293B" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600">
      Exports
    </text>
    <rect x="353" y="552" width="142" height="42" rx="21" fill="#FFFCF8" stroke="#E3DACF" />
    <text x="370" y="579" fill="#1E293B" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600">
      Dashboards
    </text>
  </g>

  <g>
    <rect x="952" y="84" width="194" height="48" rx="24" fill="#FCFBF8" fill-opacity="0.92" stroke="#EBE2D8" />
    <text x="971" y="116" fill="#111827" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600">
      High-risk review
    </text>
  </g>
</svg>
